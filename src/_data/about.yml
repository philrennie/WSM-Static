title: About Me
image: ""
body: |-
  Welcome to my shop! ✨ Here you’ll find hand-made, one-of-a-kind artworks created with love, colour, and a touch of sparkle, which are designed to uplift and inspire. I specialise in mixed media art. From striking abstract statement artwork to plushie taxidermies, from bedazzled doughnuts to zentangle-inspired pieces and slogan art, if you are a lover of the weird and wonderful, you are sure to find an artwork that you love or the perfect gift for someone special.

  I’m a wife and mum, who has picked up a paintbrush again and lots of other mediums too, after a mental health illness diagnosis. Creating art helps to distract and quiet my symptoms. It’s like magic, so now I make art to make your heart and your home happy in the hope that I will be able to share and pass on a little bit of that magic in the things that I create.
highlights:
  - Expect the unexpected – no two pieces are ever the same!
  - Handmade with love, glitter, and a dash of mischief.
  - Perfect for anyone who loves colourful, creative, and whimsical art.
