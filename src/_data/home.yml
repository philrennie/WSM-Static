  image: /images/LetsBeFriendsSelfie.jpg
  text: |-
    Hi, I’m Suzie, the artist behind What Suzie Made. I create weird and whimsical mixed media art, filled with colour, playful characters and quirky details.

    Every piece is handmade with care. My hope is that it brings a little beauty, wonder and a smile to your day.

    Thank you for supporting my work and being part of this journey. I hope you find something you love!
